---
# ╔═══════════════════════════════════════════════════════════════════╗
# ║  CONTROL PLANE — STP, VTP, DHCP snooping, ARP inspection …       ║
# ╚═══════════════════════════════════════════════════════════════════╝
#
# severity / tags / applies_to_roles / exclude_hostnames are supported
# on every check — see management_plane.yaml for full field descriptions.

compliance:
  control_plane:

    # ── SPANNING TREE ─────────────────────────────────────────────

    stp_mode:
      enabled: false
      severity: medium
      tags: [stp, layer2-security, cis]
      mode: "rapid-pvst"           # rapid-pvst | mst

    stp_extend_system_id:
      enabled: false
      severity: medium
      tags: [stp]

    stp_pathcost_method:
      enabled: false
      severity: low
      tags: [stp]
      method: "long"

    stp_loopguard_default:
      enabled: false
      severity: medium
      tags: [stp, layer2-security]

    stp_priority:
      enabled: false
      severity: medium
      tags: [stp, availability]
      # Base bridge priority, a multiple of 4096 (the VLAN ID is added by
      # the switch).  Access switches must not go below access_priority, so
      # they can never become root; roles in core_roles must be at or
      # below core_priority.
      core_priority: 4096
      access_priority: 32768
      core_roles: [core_switch]

    stp_backbonefast:
      enabled: false
      severity: low
      tags: [stp, availability]

    stp_uplinkfast:
      enabled: false
      severity: low
      tags: [stp, availability]

    # ── VTP ───────────────────────────────────────────────────────

    vtp_mode:
      enabled: false
      severity: high
      tags: [layer2-security, hardening]
      expected: "off"              # transparent | off | client | server

    vtp_domain:
      enabled: false
      severity: medium
      tags: [layer2-security]
      expected: ""

    # ── DHCP SNOOPING ─────────────────────────────────────────────

    dhcp_snooping_global:
      enabled: false
      severity: high
      tags: [layer2-security, cis, pci]
      framework_controls:
        cis_ios_xe_v4: "5.3.1"
        pci_dss_v4: "1.2.5"

    dhcp_snooping_vlans:
      enabled: false
      severity: medium
      tags: [layer2-security]
      # Optional. When set (e.g. "1-4094" or "10,20,30-40") the audit verifies
      # DHCP snooping is enabled for every VLAN listed here. Leave empty ("") to
      # only check that at least one "ip dhcp snooping vlan" line is present.
      vlans: ""

    no_dhcp_snooping_information_option:
      enabled: false
      severity: low
      tags: [layer2-security]

    # ── DYNAMIC ARP INSPECTION ────────────────────────────────────

    arp_inspection_vlans:
      enabled: false
      severity: high
      tags: [layer2-security, cis, pci]
      framework_controls:
        cis_ios_xe_v4: "5.3.2"
        pci_dss_v4: "1.2.5"
      # Optional. When set (e.g. "1-4094" or "10,20,30-40") the audit verifies
      # Dynamic ARP Inspection is enabled for every VLAN listed here. Leave
      # empty ("") to only check that at least one "ip arp inspection vlan"
      # line is present.
      vlans: ""

    arp_inspection_validate:
      enabled: false
      severity: medium
      tags: [layer2-security]
      checks: ["src-mac", "dst-mac", "ip"]

    # ── ERRDISABLE RECOVERY ───────────────────────────────────────

    errdisable_recovery:
      enabled: false
      severity: low
      tags: [availability, hardening]
      causes:
        - bpduguard
        - storm-control
        - psecure-violation
        - arp-inspection
        - dhcp-rate-limit
        - link-flap
      interval: 300

    # ── UDLD ──────────────────────────────────────────────────────

    udld_global:
      enabled: false
      severity: medium
      tags: [availability, layer2-security]
      mode: "enable"               # enable | aggressive

    # ── CONTROL-PLANE POLICING ────────────────────────────────────

    control_plane_policing:
      enabled: false
      severity: high
      tags: [availability, hardening, cis, nist]
      framework_controls:
        cis_ios_xe_v4: "5.4.1"
        nist_800_53r5: "SC-5"
